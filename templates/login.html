{% extends "base.html" %}

{% block title %}Sign In - Personal Finance Advisor Bot{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <div class="text-center mb-4">
                <div class="auth-icon-circle bg-primary-subtle text-primary mx-auto mb-3">
                    <i class="bi bi-box-arrow-in-right fs-2"></i>
                </div>
                <h3 class="fw-bold text-dark">Welcome Back</h3>
                <p class="text-muted small">Sign in to access your financial dashboard and AI advisor</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="username_or_email" class="form-label fw-semibold">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control border-start-0" id="username_or_email" name="username_or_email" value="{{ username_or_email or '' }}" placeholder="Enter username or email" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-muted small">Don't have an account yet? </span>
                <a href="{{ url_for('register') }}" class="fw-semibold text-primary text-decoration-none">Create an Account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
