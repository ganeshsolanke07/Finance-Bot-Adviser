{% extends "base.html" %}

{% block title %}Register - Personal Finance Advisor Bot{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <div class="text-center mb-4">
                <div class="auth-icon-circle bg-primary-subtle text-primary mx-auto mb-3">
                    <i class="bi bi-person-plus-fill fs-2"></i>
                </div>
                <h3 class="fw-bold text-dark">Create Your Account</h3>
                <p class="text-muted small">Start managing your personal finances with AI guidance</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST" class="needs-validation">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control border-start-0" id="username" name="username" value="{{ username or '' }}" placeholder="e.g. alex24" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="alex@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
                    </div>
                    <div class="form-text small">Passwords are securely hashed before saving.</div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" placeholder="Re-type your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold shadow-sm">
                    <i class="bi bi-arrow-right-circle me-1"></i> Register Account
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-muted small">Already have an account? </span>
                <a href="{{ url_for('login') }}" class="fw-semibold text-primary text-decoration-none">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
